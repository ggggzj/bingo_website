schema: spec-driven

context: |
  H1B Checker — website (BingoCareer). pnpm monorepo: artifacts/landing (the web app),
  artifacts/api-server (Express 5), lib/api-spec (openapi.yaml — the API contract and
  its source of truth), lib/api-client-react + lib/api-zod (generated by Orval codegen,
  never hand-edited), lib/db (Drizzle schema, source of truth), lib/coach-engine.
  Stack: Node >= 20.19, TypeScript 5.9, Postgres + Drizzle, Zod v4, esbuild CJS bundle,
  Vitest + supertest (api-server only).

  Read before writing any artifact — do not restate what it already says:
  - replit.md — the operational truth: stack, where things live, recorded architecture
    decisions, the working loop (its "User preferences" section), and gotchas. A
    proposal that reverses a recorded architecture decision must name it and say why;
    never silently contradict one.
  - ../CLAUDE.md (the workspace router) and the extension repo's roadmap files own
    product direction; this repo has no local roadmap by design.

  Boundaries that shape proposals here:
  - The API contract is lib/api-spec/openapi.yaml; after editing it, codegen must run —
    nothing else regenerates the frontend hooks.
  - Auth routes take an AuthStore seam (drizzle-store / memory-store); tests run the
    real routes, hashing and cookies against memory, never mocks.
  - Owner and coach access are configuration (OWNER_EMAIL, COACH_EMAILS), not columns;
    a non-owner answers 404, never 403.
  - The home page claims only what the extension actually ships — check a claim against
    the extension repo (../h1_checker) before adding it.

rules:
  proposal:
    - Include a Non-goals section naming what this change deliberately leaves alone.
    - Name the seam a change crosses (AuthStore, the openapi.yaml contract, the
      STATS_TOKEN upstream) rather than the concrete file, when the behavior is
      seam-independent.
  tasks:
    - "Order groups as tracer-bullet slices: each group leaves the system working end to end."
    - One task edits one area. Two tasks must never write the same file.
    - Every behavior task names the Vitest test that proves it.
    - A task that edits lib/api-spec/openapi.yaml runs codegen within the same task.

operations:
  apply:
    guidance:
      - Close each unit with the replit.md working loop ("User preferences" section),
        not just a green test run.
      - Update the relevant replit.md section; never open a second doc that repeats it.
  archive:
    guidance:
      - Append to replit.md "Architecture decisions" when the change settled a real
        design choice, with the options that were on the table and why.
