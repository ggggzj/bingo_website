openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waitlist
    description: Waitlist operations
  - name: auth
    description: Sign-up and sign-in
  - name: stats
    description: Growth dashboard, owner only
  - name: coach
    description: Interview coach, allowlisted users only
  - name: jobs
    description: The public job feed
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the waitlist
      description: Submit an email address to join the waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "201":
          description: Successfully joined waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "409":
          description: Email already on waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: Creates an account and signs the browser in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "409":
          description: That email already has an account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid email or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in
      description: >-
        Signs the browser in. A wrong password and an address with no account get
        the same answer, so this cannot be used to find out who has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out
      description: Ends the session. Answers the same whether or not there was one.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Who this browser is signed in as
      responses:
        "200":
          description: The signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs:
    get:
      operationId: getJobs
      tags: [jobs]
      summary: One page of open postings from employers with sponsorship history
      description: >-
        Proxied from the extension's API. Read-only and identity-free: browsing
        writes nothing and reads nothing about a user. Every parameter is
        allowlisted, bounded and re-encoded by this server; an out-of-range value
        is dropped rather than refused, so the page still renders.
      parameters:
        - name: employer
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: title
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: location
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: remote_only
          in: query
          required: false
          schema: { type: boolean }
        - name: posted_within_days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: include_refusals
          in: query
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        "200":
          description: One page of postings, and how many the filters matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsPage"
        "502":
          description: The extension's API could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stats:
    get:
      operationId: getStatsTotals
      tags: [stats]
      summary: Growth totals (owner only)
      description: >-
        Proxied from the extension's API. Anyone who is not the owner gets 404,
        the same answer as a path that does not exist.
      responses:
        "200":
          description: The totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsTotals"
        "404":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The extension's API could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stats/daily:
    get:
      operationId: getStatsDaily
      tags: [stats]
      summary: Day-by-day growth (owner only)
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: One point per calendar day, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsDaily"
        "404":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The extension's API could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stats/registrations:
    get:
      operationId: getStatsRegistrations
      tags: [stats]
      summary: Registered emails (owner only)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: One row per registered email, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsRegistrations"
        "404":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The extension's API could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # Coach routes answer 404 for anyone not signed in and on the COACH_EMAILS
  # allowlist — the same uniform not-found the stats routes use, so the
  # feature's existence is not confirmed to probers. The 404s below mean
  # "not allowed" as much as "no such thing".
  /coach/plan:
    get:
      operationId: getCoachPlan
      tags: [coach]
      summary: Today's practice plan
      description: >-
        Builds the caller's plan for the current UTC date. The first call of
        a day freezes the dealt assignment; later calls rebuild the same
        list with completion marks, never dealing fresh problems.
      responses:
        "200":
          description: The plan for today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachPlan"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/solved:
    post:
      operationId: setCoachSolved
      tags: [coach]
      summary: Tick or untick a problem as solved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachSolvedInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The problem was graded today and cannot be un-solved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unknown problem or invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/grade:
    post:
      operationId: recordCoachGrade
      tags: [coach]
      summary: Record a grilling grade
      description: >-
        Applies the engine's grading to the caller's review state (creating
        it on first encounter), appends one review event, and stamps the
        day log. Re-grading the same problem the same day overwrites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachGradeInput"
      responses:
        "200":
          description: The updated review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachGradeResult"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unknown problem or invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/forecast:
    get:
      operationId: getCoachForecast
      tags: [coach]
      summary: Upcoming review load per day
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
      responses:
        "200":
          description: Review count and minutes per upcoming day; overdue counts on today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachForecast"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/log:
    get:
      operationId: getCoachLog
      tags: [coach]
      summary: Day log with statuses, streak and adherence
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 366
      responses:
        "200":
          description: Trailing day-log window, newest day last
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachLog"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/insights:
    get:
      operationId: getCoachInsights
      tags: [coach]
      summary: What to do next, and why
      description: >-
        Read-only analysis over the caller's stored state: prioritized
        guidance, open and cleared knowledge gaps, per-pattern strength,
        the solved-but-never-graded backlog, and overview counters.
      responses:
        "200":
          description: The current analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachInsights"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/config:
    get:
      operationId: getCoachConfig
      tags: [coach]
      summary: The caller's coach settings
      description: Creates the row with defaults on first read.
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachConfig"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCoachConfig
      tags: [coach]
      summary: Update the caller's coach settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachConfigInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachConfig"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid settings; nothing changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/token:
    post:
      operationId: createCoachToken
      tags: [coach]
      summary: Issue a personal API token
      description: >-
        Session-only — a bearer token cannot mint its successor. The
        plaintext is returned exactly once; issuing revokes the caller's
        previous tokens.
      responses:
        "201":
          description: The new token, shown this one time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachToken"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: revokeCoachToken
      tags: [coach]
      summary: Revoke the caller's tokens
      responses:
        "200":
          description: Revoked (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WaitlistInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    WaitlistEntry:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: integer
        email:
          type: string
        createdAt:
          type: string
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
    Account:
      type: object
      required: [email, isOwner]
      properties:
        email:
          type: string
        isOwner:
          type: boolean
          description: >-
            Whether this account may see the growth dashboard. Read from the
            server's OWNER_EMAIL setting, never stored on the account.
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    # The three schemas below are owned by the extension's API; this server only
    # forwards them. Keep them in step with the FastAPI response models in that
    # project (main.py: StatsResponse, DailyResponse, RegistrationsResponse).
    JobsPage:
      type: object
      required: [total, postings]
      properties:
        total:
          type: integer
          description: Roles matching the filters, counted after collapsing copies
        postings:
          type: array
          items:
            $ref: "#/components/schemas/JobPosting"
    JobPosting:
      type: object
      description: >-
        One open role. Carries two sponsorship facts that must not be merged:
        tier / total_h1b_certified / last_active_year are claims about the
        EMPLOYER, from certified DOL filings; no_sponsor is a claim about THIS
        POSTING'S own description. They can disagree for one company.
      required: [job_id, employer_name, title, is_remote, tier, total_h1b_certified]
      properties:
        job_id: { type: integer }
        employer_name: { type: string }
        title: { type: string }
        url:
          type: [string, "null"]
          description: >-
            Absent when upstream withheld it, which it does for any scheme that
            is not http or https. A card with no url renders no apply link.
        location: { type: [string, "null"] }
        is_remote: { type: boolean }
        posted_at: { type: [string, "null"] }
        tier:
          type: string
          enum: [strong, weak]
        total_h1b_certified: { type: integer }
        last_active_year: { type: [integer, "null"] }
        no_sponsor:
          type: [boolean, "null"]
          description: >-
            true = this posting's text refuses sponsorship. false = its text was
            read and does not refuse. null = NOBODY HAS READ IT YET, which is not
            a refusal and must never be rendered as one.
    StatsTotals:
      type: object
      required:
        - daily_active
        - weekly_active
        - checks_today
        - checks_7d
        - total_clients
        - total_registrations
        - total_followers
        - total_follows
        - referral_sources
        - referrals_answered
      properties:
        daily_active: { type: integer }
        weekly_active: { type: integer }
        checks_today: { type: integer }
        checks_7d: { type: integer }
        total_clients: { type: integer }
        total_registrations: { type: integer }
        total_followers: { type: integer }
        total_follows: { type: integer }
        referral_sources:
          type: object
          additionalProperties: { type: integer }
        referrals_answered: { type: integer }
    StatsDailyPoint:
      type: object
      required: [date, new_installs, active_installs, checks, new_registrations]
      properties:
        date: { type: string }
        new_installs: { type: integer }
        active_installs: { type: integer }
        checks: { type: integer }
        new_registrations: { type: integer }
    StatsDaily:
      type: object
      required: [days, series]
      properties:
        days: { type: integer }
        series:
          type: array
          items:
            $ref: "#/components/schemas/StatsDailyPoint"
    StatsProfile:
      type: object
      properties:
        display_name: { type: string, nullable: true }
        us_state: { type: string, nullable: true }
        school: { type: string, nullable: true }
        field: { type: string, nullable: true }
        job_search_stage: { type: string, nullable: true }
        visa_status: { type: string, nullable: true }
        graduation: { type: string, nullable: true }
    StatsRegistrationRow:
      type: object
      required: [email, created_at, subscriptions]
      properties:
        email: { type: string }
        created_at: { type: string }
        installed_at: { type: string, nullable: true }
        verified_at: { type: string, nullable: true }
        referral_source: { type: string, nullable: true }
        subscriptions: { type: integer }
        profile:
          oneOf:
            - $ref: "#/components/schemas/StatsProfile"
            - type: "null"
    StatsRegistrations:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/StatsRegistrationRow"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    CoachProblemSummary:
      type: object
      required: [id, num, title, slug, difficulty, patterns, neetcodeGroup]
      properties:
        id: { type: string }
        num: { type: integer }
        title: { type: string }
        slug: { type: string }
        difficulty: { type: string, enum: [easy, medium, hard] }
        patterns:
          type: array
          items: { type: string }
        neetcodeGroup: { type: string }
    CoachPlanReviewItem:
      type: object
      required: [problem, mode, minutes, risk, daysOverdue, weakPoints, done, solved]
      properties:
        problem:
          $ref: "#/components/schemas/CoachProblemSummary"
        mode: { type: string, enum: [grill, re-solve] }
        minutes: { type: integer }
        risk: { type: number }
        daysOverdue: { type: integer }
        weakPoints:
          type: array
          items: { type: string }
        done: { type: boolean }
        solved: { type: boolean }
        grade: { type: string, enum: [pass, partial, fail], nullable: true }
    CoachPlanNewItem:
      type: object
      required: [problem, minutes, done, solved]
      properties:
        problem:
          $ref: "#/components/schemas/CoachProblemSummary"
        minutes: { type: integer }
        score: { type: number, nullable: true }
        done: { type: boolean }
        solved: { type: boolean }
        grade: { type: string, enum: [pass, partial, fail], nullable: true }
    CoachPlan:
      type: object
      required:
        - date
        - budget
        - plannedMinutes
        - reviews
        - new
        - deferredReviews
        - sprint
        - totalSeen
        - totalProblems
        - doneToday
        - solvedToday
        - assignedToday
      properties:
        date: { type: string }
        budget: { type: integer }
        plannedMinutes: { type: integer }
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/CoachPlanReviewItem"
        new:
          type: array
          items:
            $ref: "#/components/schemas/CoachPlanNewItem"
        deferredReviews: { type: integer }
        sprint: { type: boolean }
        sprintDays: { type: integer, nullable: true }
        totalSeen: { type: integer }
        totalProblems: { type: integer }
        doneToday: { type: integer }
        solvedToday: { type: integer }
        assignedToday: { type: integer }
    CoachSolvedInput:
      type: object
      required: [problemId, solved]
      properties:
        problemId: { type: string }
        solved: { type: boolean }
    CoachGradeInput:
      type: object
      required: [problemId, grade]
      properties:
        problemId: { type: string }
        grade: { type: string, enum: [pass, partial, fail] }
        weakPoints:
          type: array
          items: { type: string, maxLength: 300 }
          maxItems: 6
        mode: { type: string, enum: [grill, re-solve] }
        notes: { type: string, maxLength: 2000 }
    CoachGradeResult:
      type: object
      required: [problemId, state, intervalDays, due, lapses, weakPoints]
      properties:
        problemId: { type: string }
        state: { type: string, enum: [new, learning, review, mastered] }
        intervalDays: { type: integer }
        due: { type: string }
        lapses: { type: integer }
        weakPoints:
          type: array
          items: { type: string }
    CoachForecastDay:
      type: object
      required: [date, count, minutes]
      properties:
        date: { type: string }
        count: { type: integer }
        minutes: { type: integer }
    CoachForecast:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/CoachForecastDay"
    CoachDoneEntry:
      type: object
      required: [id, grade, mode]
      properties:
        id: { type: string }
        grade: { type: string, enum: [pass, partial, fail] }
        mode: { type: string }
    CoachLogDay:
      type: object
      required: [day, status, assignedNew, assignedReviews, plannedMinutes, solved, done]
      properties:
        day: { type: string }
        status:
          type: string
          enum: [complete, partial, ungraded, missed, extra, rest, pending]
        assignedNew:
          type: array
          items: { type: string }
        assignedReviews:
          type: array
          items: { type: string }
        plannedMinutes: { type: integer }
        solved:
          type: array
          items: { type: string }
        done:
          type: array
          items:
            $ref: "#/components/schemas/CoachDoneEntry"
    CoachAdherence:
      type: object
      required: [window, assignedDays, finishedDays, workedDays, rate]
      properties:
        window: { type: integer }
        assignedDays: { type: integer }
        finishedDays: { type: integer }
        workedDays: { type: integer }
        rate: { type: number }
    CoachLog:
      type: object
      required: [days, streak, adherence]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/CoachLogDay"
        streak: { type: integer }
        adherence:
          $ref: "#/components/schemas/CoachAdherence"
    CoachConfig:
      type: object
      required:
        [dailyMinutes, newPerDay, sprintWindowDays, targetCompanies, knownCompanies, activeTrack]
      properties:
        dailyMinutes: { type: integer }
        newPerDay: { type: integer }
        sprintWindowDays: { type: integer }
        interviewDate: { type: string, nullable: true }
        activeTrack:
          type: string
          enum: [sde, ai-engineer]
          description: >-
            Which application track's weights steer new-problem selection.
            Takes effect from the next dealt day; a frozen day keeps its
            assignment.
        targetCompanies:
          type: array
          items: { type: string }
        knownCompanies:
          type: array
          items: { type: string }
          description: >-
            Every company the problem bank carries frequency data for,
            derived from the bank — the settings page renders its
            multi-select from this, never from a hardcoded list.
    CoachConfigInput:
      type: object
      properties:
        dailyMinutes: { type: integer, minimum: 15, maximum: 480 }
        newPerDay: { type: integer, minimum: 0, maximum: 10 }
        sprintWindowDays: { type: integer, minimum: 1, maximum: 60 }
        interviewDate: { type: string, format: date, nullable: true }
        activeTrack: { type: string, enum: [sde, ai-engineer] }
        targetCompanies:
          type: array
          items: { type: string, maxLength: 40 }
          maxItems: 20
    CoachGuidanceItem:
      type: object
      required: [tone, title, body]
      properties:
        tone: { type: string, enum: [critical, warn, info, good] }
        title: { type: string }
        body: { type: string }
    CoachGap:
      type: object
      required: [point, problem, hits, survived]
      properties:
        point: { type: string }
        problem:
          $ref: "#/components/schemas/CoachProblemSummary"
        hits:
          type: integer
          description: How many gradings this exact claim has caught you on.
        survived:
          type: integer
          description: Sessions since it last bit, in which it was not cleared.
        firstHit: { type: string, nullable: true }
        lastHit: { type: string, nullable: true }
    CoachClearedGap:
      type: object
      required: [point, problem, clearedAfter]
      properties:
        point: { type: string }
        problem:
          $ref: "#/components/schemas/CoachProblemSummary"
        clearedAfter: { type: integer }
    CoachPatternRow:
      type: object
      required:
        [pattern, total, seen, solid, lapses, gaps, strength, ease, confidence]
      properties:
        pattern: { type: string }
        total: { type: integer }
        seen: { type: integer }
        solid: { type: integer }
        lapses: { type: integer }
        gaps: { type: integer }
        strength: { type: number }
        ease: { type: number }
        confidence: { type: number }
    CoachUngradedItem:
      type: object
      required: [problem, solvedOn, daysAgo]
      properties:
        problem:
          $ref: "#/components/schemas/CoachProblemSummary"
        solvedOn: { type: string }
        daysAgo: { type: integer }
    CoachOverview:
      type: object
      required:
        [seen, bank, streak, todayAssigned, todayDone, todaySolved, todayStatus]
      properties:
        seen: { type: integer }
        bank: { type: integer }
        streak: { type: integer }
        solved7d: { type: integer }
        todayAssigned: { type: integer }
        todayDone: { type: integer }
        todaySolved: { type: integer }
        todayStatus: { type: string }
        daysToInterview: { type: integer, nullable: true }
    CoachInsights:
      type: object
      required: [guidance, openGaps, clearedGaps, patterns, ungraded, overview]
      properties:
        guidance:
          type: array
          items:
            $ref: "#/components/schemas/CoachGuidanceItem"
        openGaps:
          type: array
          items:
            $ref: "#/components/schemas/CoachGap"
        clearedGaps:
          type: array
          items:
            $ref: "#/components/schemas/CoachClearedGap"
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/CoachPatternRow"
        ungraded:
          type: array
          items:
            $ref: "#/components/schemas/CoachUngradedItem"
        overview:
          $ref: "#/components/schemas/CoachOverview"
    CoachToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Shown exactly once. The server stores only its hash.
