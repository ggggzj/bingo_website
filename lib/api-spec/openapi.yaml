openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sign-up and sign-in
  - name: stats
    description: Growth dashboard, owner only
  - name: coach
    description: Interview coach, any signed-in user
  - name: jobs
    description: The public job feed
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: Creates an account and signs the browser in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "409":
          description: That email already has an account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid email or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in
      description: >-
        Signs the browser in. A wrong password and an address with no account get
        the same answer, so this cannot be used to find out who has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/google:
    post:
      operationId: signInWithGoogle
      tags: [auth]
      summary: Sign in with Google
      description: >-
        Exchanges the ID token Google's button hands the page for a session. The
        address comes from the token's verified claims, never from the request
        body, so nothing the caller writes names a person. Every failure — an
        unreadable token, one minted for another application, one Google will not
        vouch for the address of — answers the same 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredential"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAccount"
        "401":
          description: The token could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out
      description: Ends the session. Answers the same whether or not there was one.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Who this browser is signed in as
      responses:
        "200":
          description: The signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs:
    get:
      operationId: getJobs
      tags: [jobs]
      summary: One page of open postings from employers with sponsorship history
      description: >-
        Proxied from the extension's API. Read-only and identity-free: browsing
        writes nothing and reads nothing about a user. Every parameter is
        allowlisted, bounded and re-encoded by this server; an out-of-range value
        is dropped rather than refused, so the page still renders.
      parameters:
        - name: employer
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: title
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: location
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: remote_only
          in: query
          required: false
          schema: { type: boolean }
        - name: posted_within_days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: include_refusals
          in: query
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        "200":
          description: One page of postings, and how many the filters matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsPage"
        "502":
          description: The extension's API could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /new-grad-list:
    get:
      operationId: getNewGradList
      tags: [new-grad-list]
      summary: The owner's list of US early-career software postings
      description: >-
        Built from several /jobs upstream queries, merged and narrowed here. The
        upstream takes one title substring and cannot express (software AND
        early-career MINUS seniority), so the terms go out one at a time as a
        coarse net and the precise test runs on this server.

        Owner-only. Every other caller gets 404, never 403 — the same refusal the
        coach routes make, so the route's existence gives nothing away.

        Reading this list never advances the caller's marker. What is new stays
        new until POST /new-grad-list/ack, so a reload cannot spend the answer.
      responses:
        "200":
          description: The list, what is new in it, and what has closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewGradList"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /new-grad-list/ack:
    post:
      operationId: ackNewGradList
      tags: [new-grad-list]
      summary: Acknowledge the list, so what is new now stops being new
      description: >-
        Advances the caller's marker and records what was listed. Deliberately a
        separate call from the GET: advancing on render would mean a stray reload
        or a second tab silently consumed the one thing this page is for.
      responses:
        "204":
          description: Acknowledged
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applications:
    get:
      operationId: getApplications
      tags: [applications]
      summary: The applications the owner has already sent
      description: >-
        Imported from the owner's own job-search folder and kept in their account.
        The imported half — company, role, location, link, dates, the archived job
        description — is rewritten by each import; status, stage and note belong to
        the account and are changed through PATCH /applications/{id}.

        Owner-only. Every other caller gets 404, never 403 — the same refusal the
        coach and new-grad routes make, so the route's existence gives nothing away.

        `imported_at` is the age of the imported half and the page states it. These
        rows are exactly as fresh as the last time the owner ran the import, and an
        empty week must not be read as a quiet week.
      responses:
        "200":
          description: The applications and when they were last imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applications/{id}:
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Change what the owner says about one application
      description: >-
        Status, stage and note — the half of an application the account owns. The imported
        half (company, role, dates, link, archived description) is the import's and cannot
        be changed here.

        A field left out is left alone; a field sent as null is cleared. That distinction
        matters: "no stage yet" and "do not touch the stage" are different instructions, and
        a PATCH that could not tell them apart would erase notes by omission.

        Every change appends to a trail and overwrites nothing. A status that moved
        applied to interviewing to closed is three readable facts afterwards, not one.

        Owner-only; everyone else gets 404, including for an id that exists.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationEdit"
      responses:
        "200":
          description: The application as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: A status outside the vocabulary this tracker uses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applications/{id}/jd:
    get:
      operationId: getApplicationJd
      tags: [applications]
      summary: The archived job description for one application
      description: >-
        The copy taken when the application was sent. This is the half that cannot be
        re-fetched: a posting's page 404s when the req closes, and two of the owner's did
        within five days of applying.

        Served one row at a time rather than with the list, because 80 bodies are 400 kB of
        text and the list needs only to know that one exists.

        Nothing is rewritten. Where the archive was scraped from a page rather than read from
        an applicant tracking system, the site's menus and its list of other jobs are skipped
        past — `trimmed` says when that happened and `full_markdown` carries everything, so
        what was skipped is reachable rather than hidden.

        Owner-only; everyone else gets 404, as does an application with no archive.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The archived description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationJd"
        "404":
          description: Not available, or nothing was archived for it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stats:
    get:
      operationId: getStatsTotals
      tags: [stats]
      summary: Growth totals (owner only)
      description: >-
        Proxied from the extension's API. Anyone who is not the owner gets 404,
        the same answer as a path that does not exist.
      responses:
        "200":
          description: The totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsTotals"
        "404":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The extension's API could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stats/daily:
    get:
      operationId: getStatsDaily
      tags: [stats]
      summary: Day-by-day growth (owner only)
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: One point per calendar day, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsDaily"
        "404":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The extension's API could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stats/registrations:
    get:
      operationId: getStatsRegistrations
      tags: [stats]
      summary: Registered emails (owner only)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: One row per registered email, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsRegistrations"
        "404":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The extension's API could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # Coach routes answer 404 for any caller the server cannot resolve — no
  # session and no valid personal token — which is the same uniform not-found
  # the stats routes use, so the feature's existence is not confirmed to
  # probers. The 404s below mean "not allowed" as much as "no such thing".
  # Every signed-in user may practise; the rows they read and write are their
  # own, selected by the id on the session, never by a request parameter.
  /coach/plan:
    get:
      operationId: getCoachPlan
      tags: [coach]
      summary: Today's practice plan
      description: >-
        Builds the caller's plan for the current UTC date. The first call of
        a day freezes the dealt assignment; later calls rebuild the same
        list with completion marks, never dealing fresh problems.
      responses:
        "200":
          description: The plan for today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachPlan"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/solved:
    post:
      operationId: setCoachSolved
      tags: [coach]
      summary: Tick or untick a problem as solved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachSolvedInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The problem was graded today and cannot be un-solved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unknown problem or invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/grade:
    post:
      operationId: recordCoachGrade
      tags: [coach]
      summary: Record a grilling grade
      description: >-
        Applies the engine's grading to the caller's review state (creating
        it on first encounter), appends one review event, and stamps the
        day log. Re-grading the same problem the same day overwrites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachGradeInput"
      responses:
        "200":
          description: The updated review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachGradeResult"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unknown problem or invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/forecast:
    get:
      operationId: getCoachForecast
      tags: [coach]
      summary: Upcoming review load per day
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
      responses:
        "200":
          description: Review count and minutes per upcoming day; overdue counts on today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachForecast"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/log:
    get:
      operationId: getCoachLog
      tags: [coach]
      summary: Day log with statuses, streak and adherence
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 366
      responses:
        "200":
          description: Trailing day-log window, newest day last
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachLog"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/insights:
    get:
      operationId: getCoachInsights
      tags: [coach]
      summary: What to do next, and why
      description: >-
        Read-only analysis over the caller's stored state: prioritized
        guidance, open and cleared knowledge gaps, per-pattern strength,
        the solved-but-never-graded backlog, and overview counters.
      responses:
        "200":
          description: The current analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachInsights"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/config:
    get:
      operationId: getCoachConfig
      tags: [coach]
      summary: The caller's coach settings
      description: Creates the row with defaults on first read.
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachConfig"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCoachConfig
      tags: [coach]
      summary: Update the caller's coach settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachConfigInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachConfig"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid settings; nothing changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /coach/token:
    post:
      operationId: createCoachToken
      tags: [coach]
      summary: Issue a personal API token
      description: >-
        Session-only — a bearer token cannot mint its successor. The
        plaintext is returned exactly once; issuing revokes the caller's
        previous tokens.
      responses:
        "201":
          description: The new token, shown this one time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachToken"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: revokeCoachToken
      tags: [coach]
      summary: Revoke the caller's tokens
      responses:
        "200":
          description: Revoked (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: Not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
    Account:
      type: object
      required: [email, isOwner]
      properties:
        email:
          type: string
        isOwner:
          type: boolean
          description: >-
            Whether this account may see the growth dashboard. Read from the
            server's OWNER_EMAIL setting, never stored on the account.
    GoogleCredential:
      type: object
      required: [credential]
      properties:
        credential:
          type: string
          description: >-
            Google's own field name for the ID token its button hands the page,
            kept so the page can pass the response through without renaming it.
    GoogleAccount:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [passwordCleared]
          properties:
            passwordCleared:
              type: boolean
              description: >-
                True when this sign-in reached an account that already held a
                password and cleared it. A password set through open sign-up is a
                claim on an address; a Google sign-in is proof of it, so proof
                wins. The page tells the person rather than revoking a credential
                in silence.
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    # The three schemas below are owned by the extension's API; this server only
    # forwards them. Keep them in step with the FastAPI response models in that
    # project (main.py: StatsResponse, DailyResponse, RegistrationsResponse).
    JobsPage:
      type: object
      required: [total, postings]
      properties:
        total:
          type: integer
          description: Roles matching the filters, counted after collapsing copies
        postings:
          type: array
          items:
            $ref: "#/components/schemas/JobPosting"
    JobPosting:
      type: object
      description: >-
        One open role. Carries two sponsorship facts that must not be merged:
        tier / total_h1b_certified / last_active_year are claims about the
        EMPLOYER, from certified DOL filings; no_sponsor is a claim about THIS
        POSTING'S own description. They can disagree for one company.
      required: [job_id, employer_name, title, is_remote, tier, total_h1b_certified]
      properties:
        job_id: { type: integer }
        employer_name: { type: string }
        title: { type: string }
        url:
          type: [string, "null"]
          description: >-
            Absent when upstream withheld it, which it does for any scheme that
            is not http or https. A card with no url renders no apply link.
        location: { type: [string, "null"] }
        is_remote: { type: boolean }
        posted_at: { type: [string, "null"] }
        tier:
          type: string
          enum: [strong, weak]
        total_h1b_certified: { type: integer }
        last_active_year: { type: [integer, "null"] }
        no_sponsor:
          type: [boolean, "null"]
          description: >-
            true = this posting's text refuses sponsorship. false = its text was
            read and does not refuse. null = NOBODY HAS READ IT YET, which is not
            a refusal and must never be rendered as one.
    NewGradPosting:
      description: >-
        A posting on the owner's list. It IS a JobPosting — same shape, so the
        component that renders the two sponsorship facts is imported rather than
        re-implemented — plus what this list knows that browsing does not.
      allOf:
        - $ref: "#/components/schemas/JobPosting"
        - type: object
          required: [class_year, location_read, is_new]
          properties:
            class_year:
              type: string
              enum: [target, none]
              description: >-
                Whether the title names the class this list is for. `other` never
                appears: a posting naming a different class is absent, not ranked
                low. Sorts first; it is a property of the posting, never a score
                about the reader.
            location_read:
              type: string
              enum: [us, unknown]
              description: >-
                `elsewhere` never appears — those are absent. `unknown` means the
                location string could not be read and the row SHALL be marked, not
                assumed American.
            is_new:
              type: boolean
              description: First seen upstream after the caller's last acknowledgement.
    NewGradClosed:
      type: object
      description: >-
        A posting that was on this list at the last acknowledgement and is no
        longer open. Carried as its own shape because the upstream cannot return
        it — browsing serves open postings only, so a closed one is knowable only
        from what we recorded when it was listed.
      required: [job_id, employer_name, title]
      properties:
        job_id: { type: integer }
        employer_name: { type: string }
        title: { type: string }
        url: { type: [string, "null"] }
    NewGradList:
      type: object
      required: [target_class_year, postings, closed, board_note]
      properties:
        target_class_year:
          type: integer
          description: The class this list is fenced to. Configuration, not a literal.
        postings:
          type: array
          items:
            $ref: "#/components/schemas/NewGradPosting"
        closed:
          type: array
          items:
            $ref: "#/components/schemas/NewGradClosed"
        board_note:
          type: string
          description: >-
            What this list cannot see, in words the page shows verbatim. Employers
            running their own careers sites are not among the boards behind it, and
            a reader who does not know that will read an absence as an answer.
    Application:
      type: object
      description: >-
        One application the owner sent, as the account holds it: the imported half
        plus whatever they have said about it themselves.
      required:
        [id, company, role, status, status_source, days_waiting, has_jd]
      properties:
        id: { type: integer }
        company: { type: string }
        role: { type: string }
        location: { type: [string, "null"] }
        region: { type: [string, "null"] }
        ats:
          type: [string, "null"]
          description: Greenhouse / Ashby / Workday / 公司官网 / Oracle, as the folder classified it.
        url:
          type: [string, "null"]
          description: >-
            The posting. Often dead — a req closes and the page 404s, which is why
            the archived body exists.
        status:
          type: string
          description: >-
            What this application is: saved / applied / interview / closed. The
            owner's own answer where they have given one, otherwise what the
            imported CSV said. `status_source` says which, because presenting an
            import's guess as the owner's judgement is the lie this field could tell.
        status_source:
          type: string
          enum: [owner, import]
        stage:
          type: [string, "null"]
          description: Free text the owner writes, e.g. "OA" / "拒信 · 不提供 sponsorship".
        note: { type: [string, "null"] }
        applied_date: { type: [string, "null"], format: date }
        saved_date: { type: [string, "null"], format: date }
        days_waiting:
          type: [integer, "null"]
          description: >-
            Days since the application was sent. Null when it was never sent — a
            saved row has nothing to wait for. A fact about two dates and nothing
            more; no deadline is predicted from it.
        has_jd:
          type: boolean
          description: >-
            Whether a copy of the job description was archived. The body itself is
            a separate request, so a list of 94 does not carry 400 kB of text.
    ApplicationEdit:
      type: object
      description: >-
        What the browser may write. Absent means "leave it"; null means "clear it".
      properties:
        status:
          type: string
          enum: [saved, applied, interview, closed]
          description: >-
            The four the owner's own folder uses. A value outside them is refused rather
            than stored, so the vocabulary cannot drift one typo at a time.
        stage:
          type: [string, "null"]
        note:
          type: [string, "null"]
    ApplicationJd:
      type: object
      required: [markdown, trimmed, full_markdown]
      properties:
        markdown:
          type: string
          description: What to show — the archive's own header, then the description.
        trimmed:
          type: boolean
          description: >-
            Whether page furniture was skipped past. Stated rather than assumed: a reader who
            does not know text was cut cannot tell a short job description from a trimmed one.
        full_markdown:
          type: string
          description: Everything the archive holds, so nothing is only hidden.
        source:
          type: [string, "null"]
          description: '"Greenhouse API", "Workday API", "HTML 抓取" — how the copy was taken.'
    ApplicationList:
      type: object
      required: [applications, imported_at]
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        imported_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the import last ran. Null when nothing has been imported yet, which
            the page states rather than drawing an empty table.
    StatsTotals:
      type: object
